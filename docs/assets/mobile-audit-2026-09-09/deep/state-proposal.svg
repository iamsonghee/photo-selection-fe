<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890"><title>모바일 정밀 재설계 — 오류와 짧은 화면 상태 시안</title><style>text{font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;fill:#023852}.b{font-weight:700}.m{fill:#53798b}.w{fill:white}.red{fill:#dc2e2f}</style><rect x="0" y="0" width="1200" height="890" rx="0" fill="#edf3f4"/><text x="32" y="42" font-size="26" class="b" text-anchor="start">모바일 상태 설계 · 실패와 짧은 화면에서도 작업을 이어가기</text><text x="32" y="71" font-size="13" class="m" text-anchor="start">PROPOSAL / 미구현 / 각 프레임 320×568 / 실제 데이터가 아닌 구조 시안</text><text x="32" y="121" font-size="20" class="b" text-anchor="start">01  목록 조회 실패</text><rect x="32" y="160" width="320" height="568" rx="16" fill="#f5f8f8"/><text x="440" y="121" font-size="20" class="b" text-anchor="start">02  업로드창 · 짧은 화면</text><rect x="440" y="160" width="320" height="568" rx="16" fill="#f5f8f8"/><text x="848" y="121" font-size="20" class="b" text-anchor="start">03  생성 실패 · 입력 보존</text><rect x="848" y="160" width="320" height="568" rx="16" fill="#f5f8f8"/><text x="52" y="194" font-size="17" class="b" text-anchor="start">A-CUT.</text><text x="306" y="194" font-size="13" class="m" text-anchor="start">설정</text><text x="52" y="250" font-size="22" class="b" text-anchor="start">프로젝트</text><text x="192" y="382" font-size="19" class="b" text-anchor="middle">목록을 불러오지 못했어요</text><text x="192" y="412" font-size="12" class="m" text-anchor="middle">연결 상태를 확인하고 다시 시도해 주세요.</text><rect x="72" y="446" width="240" height="48" rx="8" fill="#ff5712"/><text x="192.0" y="476" font-size="14" class="b w" text-anchor="middle">다시 시도</text><text x="32" y="770" font-size="14" class="b" text-anchor="start">실패를 신규 프로젝트 안내로 바꾸지 않기</text><text x="32" y="797" font-size="13" class="m" text-anchor="start">기존 목록이 있다면 유지 + 갱신 실패 안내</text><rect x="440" y="160" width="320" height="568" rx="16" fill="#fff"/><text x="456" y="196" font-size="19" class="b" text-anchor="start">보정본 업로드</text><text x="722" y="195" font-size="24" class="m" text-anchor="middle">×</text><text x="456" y="246" font-size="14" class="b" text-anchor="start">대상 3장 · 새 파일 0장</text><text x="456" y="275" font-size="12" class="m" text-anchor="start">셀렉 사진에 맞는 보정본을 선택해 주세요.</text><rect x="456" y="305" width="288" height="200" rx="12" fill="#f5f8f8"/><text x="600" y="353" font-size="17" class="b" text-anchor="middle">보정본 파일 선택</text><text x="600" y="380" font-size="11" class="m" text-anchor="middle">파일명 기준 매칭 후 직접 확인할 수 있어요.</text><rect x="488" y="410" width="224" height="48" rx="8" fill="#ff5712"/><text x="600.0" y="440" font-size="14" class="b w" text-anchor="middle">파일 선택</text><text x="456" y="542" font-size="13" class="b" text-anchor="start">사진별로 직접 매칭</text><text x="456" y="566" font-size="12" class="m" text-anchor="start">파일 선택 결과는 이 영역에서 스크롤합니다.</text><rect x="440" y="612" width="320" height="116" rx="0" fill="#eef3f4"/><text x="456" y="637" font-size="12" class="m" text-anchor="start">보정본 파일을 선택하면 업로드할 수 있어요.</text><rect x="456" y="655" width="108" height="48" rx="8" fill="#eef3f4"/><text x="510.0" y="685" font-size="14" class="b" text-anchor="middle">취소</text><rect x="572" y="655" width="172" height="48" rx="8" fill="#dce5e8"/><text x="658" y="685" font-size="14" class="m b" text-anchor="middle">업로드</text><text x="440" y="770" font-size="14" class="b" text-anchor="start">설명 위 / 버튼 아래 · 버튼 높이 48px</text><text x="440" y="797" font-size="13" class="m" text-anchor="start">header·footer 유지, body 독립 스크롤</text><text x="866" y="194" font-size="25" class="m" text-anchor="start">‹</text><text x="1008" y="194" font-size="17" class="b" text-anchor="middle">새 프로젝트 만들기</text><text x="864" y="255" font-size="13" class="b" text-anchor="start">프로젝트명</text><rect x="864" y="272" width="288" height="48" rx="10" fill="#fff"/><text x="878" y="302" font-size="16" class="" text-anchor="start">가을 가족 기념 촬영</text><text x="864" y="353" font-size="13" class="b" text-anchor="start">고객 이름</text><rect x="864" y="370" width="288" height="48" rx="10" fill="#fff"/><text x="878" y="400" font-size="16" class="" text-anchor="start">김민지</text><text x="864" y="452" font-size="13" class="m" text-anchor="start">입력한 내용은 그대로 유지됩니다.</text><rect x="864" y="486" width="288" height="76" rx="10" fill="#fff0ed"/><text x="878" y="514" font-size="14" class="red b" text-anchor="start">프로젝트를 만들지 못했어요.</text><text x="878" y="541" font-size="12" class="red" text-anchor="start">연결을 확인한 후 다시 시도해 주세요.</text><rect x="848" y="612" width="320" height="116" rx="0" fill="#fff"/><text x="864" y="637" font-size="12" class="m" text-anchor="start">설정과 입력값을 확인하고 다시 시도해 주세요.</text><rect x="864" y="655" width="92" height="48" rx="8" fill="#eef3f4"/><text x="910.0" y="685" font-size="14" class="b" text-anchor="middle">취소</text><rect x="964" y="655" width="188" height="48" rx="8" fill="#ff5712"/><text x="1058.0" y="685" font-size="14" class="b w" text-anchor="middle">다시 시도</text><text x="848" y="770" font-size="14" class="b" text-anchor="start">보이는 실패 안내 + 입력값 보존</text><text x="848" y="797" font-size="13" class="m" text-anchor="start">처리 중에도 “생성 중…” 이름·버튼 크기 유지</text><text x="32" y="852" font-size="14" class="b" text-anchor="start">별도 우선 검증: long press 1회 = 사진 1장 선택 · 모든 dialog 배경 차단/포커스 · 원본 허용값과 버튼 의미 일치</text></svg>